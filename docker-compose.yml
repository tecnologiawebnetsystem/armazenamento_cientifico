services:
  web:
    image: ${JFROG_REGISTRY:-jfrog.petrobras.dev.br}/${JFROG_DOCKER_REPOSITORY:?Defina JFROG_DOCKER_REPOSITORY no .env}/armazenamento-cientifico-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${IMAGE_TAG:-local}
    container_name: armazenamento-cientifico-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://back-end:8080}
    depends_on:
      back-end:
        condition: service_healthy
    ports:
      - "3000:3000"

  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${IMAGE_TAG:-local}
    image: ${JFROG_REGISTRY:-jfrog.petrobras.dev.br}/${JFROG_DOCKER_REPOSITORY:?Defina JFROG_DOCKER_REPOSITORY no .env}/armazenamento-cientifico-back-end:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_ENGINE: postgresql
      RDS_AURORA_POSTGRES_HOST: ${RDS_AURORA_POSTGRES_HOST:?Defina o host PostgreSQL/Aurora}
      RDS_AURORA_POSTGRES_USERNAME: ${RDS_AURORA_POSTGRES_USERNAME:?Defina o usuário PostgreSQL/Aurora}
      RDS_AURORA_POSTGRES_PASSWORD: ${RDS_AURORA_POSTGRES_PASSWORD:?Defina a senha PostgreSQL/Aurora}
      RDS_AURORA_POSTGRES_URL: ${RDS_AURORA_POSTGRES_URL:?Defina a URL PostgreSQL/Aurora}
      DB_SCHEMA: public
      PYTHONPATH: /app
      SEED_DATABASE: ${SEED_DATABASE:-false}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
    # O banco não é iniciado pelo Compose por enquanto.
    # Quando o banco estiver provisionado na AWS, informe as variáveis abaixo
    # no ambiente de execução e remova este comentário se precisar de uma
    # dependência local explícita.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8080:8080"

