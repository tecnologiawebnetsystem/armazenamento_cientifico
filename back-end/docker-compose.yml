services:
  back-end:
    image: ${JFROG_REGISTRY:-jfrog.petrobras.dev.br}/${JFROG_DOCKER_REPOSITORY:?Defina JFROG_DOCKER_REPOSITORY no .env}/armazenamento-cientifico-back-end:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${IMAGE_TAG:-local}
    container_name: armazenamento-cientifico-back-end
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: ${DATABASE_ENGINE:-postgresql}
      RDS_AURORA_POSTGRES_HOST: ${RDS_AURORA_POSTGRES_HOST:-postgres}
      RDS_AURORA_POSTGRES_USERNAME: ${RDS_AURORA_POSTGRES_USERNAME:-armazenamento}
      RDS_AURORA_POSTGRES_PASSWORD: ${RDS_AURORA_POSTGRES_PASSWORD:-armazenamento}
      RDS_AURORA_POSTGRES_URL: ${RDS_AURORA_POSTGRES_URL:-postgresql+psycopg://armazenamento:armazenamento@postgres:5432/armazenamento_cientifico}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      PYTHONPATH: /app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: armazenamento-cientifico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: armazenamento_cientifico
      POSTGRES_USER: armazenamento
      POSTGRES_PASSWORD: armazenamento
    ports:
      - "5432:5432"
    volumes:
      - armazenamento_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armazenamento -d armazenamento_cientifico"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  armazenamento_postgres_data:
