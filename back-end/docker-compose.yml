services:
  back-end:
    image: ${JFROG_REGISTRY:-jfrog.petrobras.dev.br}/${JFROG_DOCKER_REPOSITORY:?Defina JFROG_DOCKER_REPOSITORY no .env}/armazenamento-cientifico-back-end:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${IMAGE_TAG:-local}
    container_name: armazenamento-cientifico-back-end
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: ${DATABASE_ENGINE:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://armazenamento:armazenamento@postgres:5432/armazenamento_cientifico}
      PYTHONPATH: /app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: armazenamento-cientifico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: armazenamento_cientifico
      POSTGRES_USER: armazenamento
      POSTGRES_PASSWORD: armazenamento
    ports:
      - "5432:5432"
    volumes:
      - armazenamento_postgres_data:/var/lib/postgresql/data
      - ./database/projects-schema.sql:/docker-entrypoint-initdb.d/001-projects-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armazenamento -d armazenamento_cientifico"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  armazenamento_postgres_data:
