<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama ER do banco SIGAC</title>
  <desc id="desc">Relacionamentos entre perfis, usuários, projetos, grupos de acesso, arquivos e logs de atividade.</desc>
  <rect width="1200" height="760" fill="#f4f7f5"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#006b3f">SIGAC — Modelo de dados</text>
  <text x="60" y="84" font-family="Arial, sans-serif" font-size="16" fill="#334155">Fonte: database/projects-schema.sql | PostgreSQL</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#0f172a" stroke="#006b3f" stroke-width="2">
    <rect x="70" y="135" width="205" height="100" rx="10" fill="#ffffff"/><rect x="350" y="135" width="205" height="120" rx="10" fill="#ffffff"/><rect x="660" y="135" width="230" height="150" rx="10" fill="#ffffff"/>
    <rect x="80" y="385" width="230" height="135" rx="10" fill="#ffffff"/><rect x="390" y="385" width="230" height="135" rx="10" fill="#ffffff"/><rect x="700" y="385" width="230" height="135" rx="10" fill="#ffffff"/>
    <rect x="980" y="385" width="170" height="135" rx="10" fill="#fff8d6" stroke="#eab308"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="90" y="165" font-size="18" font-weight="700">profiles</text><text x="90" y="190">id, name, description</text><text x="90" y="212">created_at</text>
    <text x="370" y="165" font-size="18" font-weight="700">users</text><text x="370" y="190">id, external_id, name</text><text x="370" y="212">email, profile_id</text><text x="370" y="234">created_at, updated_at</text>
    <text x="680" y="165" font-size="18" font-weight="700">projects</text><text x="680" y="190">id, code, name</text><text x="680" y="212">responsible_area</text><text x="680" y="234">snow_task_number</text><text x="680" y="256">parent_folder_name</text><text x="680" y="278">created_by, timestamps</text>
    <text x="100" y="415" font-size="18" font-weight="700">project_access_groups</text><text x="100" y="440">project_id, provider</text><text x="100" y="462">group_name, access_level</text><text x="100" y="484">unique project/provider/name</text>
    <text x="410" y="415" font-size="18" font-weight="700">project_access_roles</text><text x="410" y="440">project_id, provider</text><text x="410" y="462">role_name, access_level</text><text x="410" y="484">unique project/provider/name</text>
    <text x="720" y="415" font-size="18" font-weight="700">files</text><text x="720" y="440">id, project_id, parent_id</text><text x="720" y="462">kind, name, size_bytes</text><text x="720" y="484">mime_type, timestamps</text>
    <text x="1000" y="415" font-size="18" font-weight="700">activity_logs</text><text x="1000" y="440">user_id, action</text><text x="1000" y="462">entity, details</text><text x="1000" y="484">created_at</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none"><path d="M275 185 H350"/><path d="M555 195 H660"/><path d="M760 284 V385"/><path d="M660 230 H540 V385 H310"/><path d="M660 230 H540 V385 H390"/><path d="M890 215 H1040 V385"/><path d="M455 255 V330 H195 V385"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#64748b"><text x="290" y="178">1:N</text><text x="590" y="188">1:N</text><text x="775" y="350">1:N</text><text x="1000" y="350">N:1</text></g>
  <text x="70" y="650" font-family="Arial, sans-serif" font-size="15" fill="#475569">Nota: file_shares e project_managers são tabelas associativas com chaves compostas.</text>
</svg>
