[project]
name = "armazenamento-cientifico-backend"
version = "0.1.0"
description = "API FastAPI para a Plataforma de Armazenamento Científico"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic[email]>=2.8,<3.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "greenlet>=3.0,<4.0",
  "alembic>=1.16,<2.0",
  "python-multipart>=0.0.9,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: testes que exigem PostgreSQL configurado"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uvicorn]
app = "main:app"
host = "0.0.0.0"
port = 8080
reload = true
