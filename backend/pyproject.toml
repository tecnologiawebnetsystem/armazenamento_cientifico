[project]
name = "armazenamento-cientifico-backend"
version = "0.1.0"
description = "API FastAPI para a Plataforma de Armazenamento Científico"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic[email]>=2.8,<3.0",
  "asyncpg>=0.29,<1.0",
]

[tool.uvicorn]
app = "main:app"
host = "0.0.0.0"
port = 8000
reload = true
